<footer>
  <div class="footer-content">
    <div class="copyright">
      <span class="date">&copy; {{ year }}</span> {{ author }}
    </div>
    <div class="footer-time">
      <span class="date">{{ year }}</span>
      <span class="clock" role="img" aria-label="Current time" data-clock>
        <span class="clock-hand clock-hand--second"></span>
        <span class="clock-hand clock-hand--minute"></span>
        <span class="clock-hand clock-hand--hour"></span>
      </span>
    </div>
  </div>
</footer>
