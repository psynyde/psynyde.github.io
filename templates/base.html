<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <style>
    :root { --bg: #faf4ed; }
    html.dark { --bg: #1c1c1c; }
    html { background-color: var(--bg); color-scheme: light; }
    html.dark { color-scheme: dark; }
  </style>
  <script>
    try {
      var stored = localStorage.getItem('chiri-theme');
      if (stored !== 'dark' && stored !== 'light') stored = null;
      var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
      document.documentElement.style.colorScheme = theme;
    } catch (_) {
      document.documentElement.classList.add('light');
    }
  </script>
  <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Besley-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/code-theme.css">
  <script src="/app.js" defer></script>
{{{ head_extra }}}</head>
<body data-centered="true" data-width="true" data-copy-code="{{ copy_code }}" style="max-width: {{ content_width }}; --content-width: {{ content_width }}">
  <div class="layout-wrapper" id="transition-wrapper">
    <div class="{{ page_class }}">
      {{{ header }}}
      <main>{{{ body }}}</main>
      {{{ footer }}}
    </div>
  </div>
</body>
</html>
