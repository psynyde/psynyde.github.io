version: 2
updates:
  # Enable Bun dependency updates
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      # Check for updates every Monday at 09:00 (Asia/Shanghai)
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    # Limit the number of open PRs created by Dependabot
    open-pull-requests-limit: 10
    # Allow automatic merging of non-major version updates
    allow:
      - dependency-type: 'all'
    assignees:
      - 'the3ash'
    commit-message:
      # Use 'deps' for dependency updates
      prefix: 'deps'
      include: 'scope'
    # Labels to add to Dependabot PRs
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # Ignore major version updates (breaking changes)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Enable GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      # Check for updates every Monday at 09:00 (Asia/Shanghai)
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 10
    assignees:
      - 'the3ash'
    commit-message:
      prefix: 'github-actions'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
      - 'github-actions'
